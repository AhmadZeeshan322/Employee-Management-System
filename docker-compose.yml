services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ems-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    networks:
      - ems-network
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: ems-app-container
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - ems-network
    stdin_open: true
    tty: true

networks:
  ems-network:
    driver: bridge

volumes:
  sql-data: